name: Build AURORA Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURORA-Mobile-V2.0.3-FULL-SOURCE/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="AURORA-Mobile-V2.0.3-FULL-SOURCE/AURORA-Mobile-V2"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project not found at $PROJECT_DIR"
            find . -name build.gradle.kts -print
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-Mobile-2.0.3-debug-APK
          path: AURORA-Mobile-V2.0.3-FULL-SOURCE/AURORA-Mobile-V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
